<!DOCTYPE html>
<!-- Social image source (not part of the site). Render: python tools/og/render_og.py -->
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="/assets/fonts/fonts.css" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #2a1d14; color: #f6f0e3; font-family: 'Hanken Grotesk', sans-serif; position: relative; }
  .art { position: absolute; right: -60px; top: -10px; width: 780px; height: 585px; object-fit: cover; }
  .fade { position: absolute; inset: 0; background: linear-gradient(to right, #2a1d14 38%, rgba(42,29,20,0.6) 55%, rgba(42,29,20,0) 70%); }
  .copy { position: absolute; left: 72px; top: 92px; width: 560px; }
  .logo { width: 84px; height: auto; }
  h1 { font-family: 'Fraunces', serif; font-weight: 700; font-size: 60px; line-height: 1.04; margin-top: 28px; }
  h1 em { font-style: italic; font-weight: 400; color: #eab160; }
  .ml { font-family: 'Noto Serif Malayalam', serif; font-weight: 600; font-size: 26px; color: #f3d58a; margin-top: 18px; line-height: 1.6; }
  .meta { margin-top: 18px; font-size: 22px; letter-spacing: 0.02em; color: #ece4d4; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 36px; background: url('/assets/patterns/kasavu.svg') repeat-x center / auto 100%; }
</style>
</head>
<body>
  <img class="art" src="/images/site/lamp-lit-1600.jpg" alt="" />
  <div class="fade"></div>
  <div class="copy">
    <img class="logo" src="/images/optimized/shema-logo-184.webp" alt="" />
    <h1>Shepparton Malayalee <em>Association</em></h1>
    <p class="ml" lang="ml">ഷെപ്പാർട്ടൺ മലയാളി അസോസിയേഷൻ</p>
    <p class="meta">Greater Shepparton, Victoria · Established 2016</p>
  </div>
  <div class="band"></div>
</body>
</html>
